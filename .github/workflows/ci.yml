name: CPU reproducibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific runtime and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Mathematical and data contracts
        run: python -m unittest discover -s tests -v
      - name: Verify frozen paper results
        run: palr-df verify-results --output runs/tables
      - name: Regenerate main result figures
        run: palr-df figures --output runs/figures
